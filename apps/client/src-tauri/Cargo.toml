[package]
name = "toph-client"
version = "0.1.0"
description = "Toph Client"
authors = ["Toph"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "toph_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "rt-multi-thread", "sync", "process", "fs", "net", "io-util"] }
tauri-plugin-dialog = "2"
rand = "0.8"
dunce = "1"
sha2 = "0.10"

[target.'cfg(not(target_os = "android"))'.dependencies]
toph-server = { path = "../../../services/toph" }


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
