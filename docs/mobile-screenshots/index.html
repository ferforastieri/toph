<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Toph Mobile · prints de validação</title>
<style>
  :root { color-scheme: dark; --bg:#0a0a0a; --card:#171717; --line:#2c2c2c; --text:#f5f5f5; --muted:#a3a3a3; --accent:#ffb547; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { max-width:1280px; margin:0 auto; padding:40px 24px 18px; }
  h1 { margin:0 0 8px; font-size:34px; letter-spacing:-.03em; }
  p { margin:0; color:var(--muted); line-height:1.55; }
  .badge { display:inline-flex; align-items:center; gap:8px; margin-top:16px; padding:8px 12px; border:1px solid #4a3312; border-radius:999px; background:#211708; color:var(--accent); font-size:13px; font-weight:600; }
  main { max-width:1280px; margin:0 auto; padding:16px 24px 64px; display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:28px; }
  figure { margin:0; background:var(--card); border:1px solid var(--line); border-radius:22px; padding:10px; }
  figure img { display:block; width:100%; height:auto; border-radius:14px; background:#000; }
  figcaption { display:flex; justify-content:space-between; gap:12px; padding:12px 4px 2px; font-size:13px; color:var(--muted); }
  figcaption strong { color:var(--text); font-size:14px; font-weight:650; }
  code { color:#d4d4d4; font-size:12px; }
  @media (max-width:520px) { header { padding-top:24px; } h1 { font-size:28px; } main { padding:12px 12px 40px; gap:16px; } }
</style>
</head>
<body>
<header>
  <h1>Toph Mobile · prints de validação</h1>
  <p>iPhone 14 Pro · 393 × 852 · tema escuro · dados de demonstração. Build local, ainda não publicada no servidor. Documentação gerada em 31/10/2026.</p>
  <div class="badge">● Prints reais gerados no Chromium mobile</div>
</header>
<main>

  <figure><a href="02-drawer.png"><img src="02-drawer.png" alt="Drawer" /></a><figcaption><strong>Drawer</strong><code>swipe →</code></figcaption></figure>
  <figure><a href="03-arquivos.png"><img src="03-arquivos.png" alt="Arquivos" /></a><figcaption><strong>Arquivos</strong><code>busca + árvore</code></figcaption></figure>
  <figure><a href="04-git.png"><img src="04-git.png" alt="Git" /></a><figcaption><strong>Git</strong><code>changes + commit</code></figcaption></figure>
  <figure><a href="05-bancos.png"><img src="05-bancos.png" alt="Bancos" /></a><figcaption><strong>Bancos</strong><code>connections + schema</code></figcaption></figure>
  <figure><a href="06-web.png"><img src="06-web.png" alt="Web apps" /></a><figcaption><strong>Web apps</strong><code>cards</code></figcaption></figure>
  <figure><a href="07-terminal.png"><img src="07-terminal.png" alt="Terminal" /></a><figcaption><strong>Terminal</strong><code>full screen</code></figcaption></figure>
  <figure><a href="12-editor.png"><img src="12-editor.png" alt="Editor" /></a><figcaption><strong>Editor</strong><code>arquivo aberto</code></figcaption></figure>
  <figure><a href="08-conta.png"><img src="08-conta.png" alt="Conta" /></a><figcaption><strong>Conta</strong><code>avatar sheet</code></figcaption></figure>
  <figure><a href="09-branch.png"><img src="09-branch.png" alt="Branch" /></a><figcaption><strong>Branch</strong><code>troca + criação</code></figcaption></figure>
  <figure><a href="10-notificacoes.png"><img src="10-notificacoes.png" alt="Notificações" /></a><figcaption><strong>Notificações</strong><code>sheet</code></figcaption></figure>
  <figure><a href="11-projetos.png"><img src="11-projetos.png" alt="Projetos" /></a><figcaption><strong>Projetos</strong><code>mesmo seletor do desktop</code></figcaption></figure>
</main>
</body>
</html>
