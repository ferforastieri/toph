<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="Toph" />
    <meta name="description" content="Seu workbench local e self-hosted." />
    <link rel="icon" type="image/png" href="/toph-app-icon.png" />
    <title>Toph</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; background: #000; }
      #startup-splash { width: 100%; height: 100%; display: grid; place-items: center; color: #f5f5f5; font: 600 16px Inter, system-ui, sans-serif; }
      #startup-splash-inner { display: grid; justify-items: center; gap: 14px; }
      #startup-splash img { width: 64px; height: 64px; border-radius: 18px; box-shadow: 0 0 40px rgba(255, 181, 71, .22); }
      #startup-splash-dot { width: 7px; height: 7px; border-radius: 999px; background: #ffb547; animation: toph-startup-pulse 1s ease-in-out infinite; }
      @keyframes toph-startup-pulse { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
    </style>
  </head>
  <body>
    <div id="root">
      <main id="startup-splash" aria-label="Toph iniciando">
        <div id="startup-splash-inner">
          <img src="/toph-app-icon.png" alt="" />
          <span>Toph</span>
          <span id="startup-splash-dot" aria-hidden="true"></span>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
