name: Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version (without v)"
        required: false
        default: "0.1.0"
  workflow_call:
    inputs:
      version:
        description: "Installer version (without v)"
        required: false
        type: string
        default: ""
      ref:
        description: "Git commit to build"
        required: false
        type: string
        default: ""
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            bundles: appimage,deb,rpm
          - platform: windows-latest
            bundles: msi,nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend -> target
            desktop/src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        # The Azure Ubuntu mirror is regularly unreachable from hosted runners;
        # a hanging apt must fail fast instead of stalling the whole release.
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          sudo sed -i -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors.txt 2>/dev/null || true
          echo "apt mirror:"; cat /etc/apt/apt-mirrors.txt 2>/dev/null || true
          apt_options=(-o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=2 -o Acquire::ForceIPv4=true -o DPkg::Lock::Timeout=60)
          for attempt in 1 2; do
            if sudo DEBIAN_FRONTEND=noninteractive timeout 300 apt-get "${apt_options[@]}" update; then
              break
            fi
            if [ "$attempt" = 2 ]; then
              exit 1
            fi
            sleep 5
          done
          for attempt in 1 2; do
            if sudo DEBIAN_FRONTEND=noninteractive timeout 600 apt-get "${apt_options[@]}" install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev; then
              exit 0
            fi
            if [ "$attempt" = 2 ]; then
              exit 1
            fi
            sleep 5
          done

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Resolve desktop version
        id: version
        shell: bash
        working-directory: desktop
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION#v}"
          if [ -z "$version" ]; then
            case "$GITHUB_REF_NAME" in
              desktop-v*) version="${GITHUB_REF_NAME#desktop-v}" ;;
              *) version="0.1.0" ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build web UI
        run: npm run build:web

      - name: Build desktop
        working-directory: desktop
        env:
          TOPH_VERSION: ${{ steps.version.outputs.version }}
        run: npm run tauri -- build --bundles "${{ matrix.bundles }}" --config '{"version":"${{ steps.version.outputs.version }}"}'

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: toph-client-desktop-${{ matrix.platform }}
          path: desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
