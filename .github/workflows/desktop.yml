name: Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version (without v)"
        required: false
        default: "0.1.0"
  workflow_call:
    inputs:
      version:
        description: "Installer version (without v)"
        required: false
        type: string
        default: ""
      ref:
        description: "Git commit to build"
        required: false
        type: string
        default: ""
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            bundles: appimage,deb,rpm
          - platform: windows-latest
            bundles: msi,nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            backend -> target
            desktop/src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        # Hosted Ubuntu runners have been unable to resolve the default
        # Ubuntu mirrors. Try independent mirrors, and never let this step
        # stall the whole release.
        timeout-minutes: 18
        shell: bash
        run: |
          set -euo pipefail
          mirrors=(
            "https://mirrors.edge.kernel.org/ubuntu"
            "https://ftp.osuosl.org/pub/ubuntu"
            "https://mirrors.ocf.berkeley.edu/ubuntu"
            "https://archive.ubuntu.com/ubuntu"
          )
          apt_options=(-o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Retries=1 -o Acquire::ForceIPv4=true -o DPkg::Lock::Timeout=60)
          # Every mirror we may have written into the sources, so the next
          # attempt really switches instead of rewriting the one already set.
          ubuntu_hosts='(azure\.archive\.ubuntu\.com|archive\.ubuntu\.com|security\.ubuntu\.com|ports\.ubuntu\.com|mirrors\.edge\.kernel\.org|ftp\.osuosl\.org|mirrors\.ocf\.berkeley\.edu)'
          for mirror in "${mirrors[@]}"; do
            echo "== trying apt mirror $mirror"
            for file in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/apt-mirrors.txt; do
              [ -f "$file" ] || continue
              sudo sed -i -E "s#https?://${ubuntu_hosts}(/pub)?/ubuntu#${mirror}#g" "$file"
            done
            if ! sudo DEBIAN_FRONTEND=noninteractive timeout 180 apt-get "${apt_options[@]}" update; then
              continue
            fi
            if sudo DEBIAN_FRONTEND=noninteractive timeout 480 apt-get "${apt_options[@]}" install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev; then
              exit 0
            fi
          done
          exit 1

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Resolve desktop version
        id: version
        shell: bash
        working-directory: desktop
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION#v}"
          if [ -z "$version" ]; then
            case "$GITHUB_REF_NAME" in
              desktop-v*) version="${GITHUB_REF_NAME#desktop-v}" ;;
              *) version="0.1.0" ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build web UI
        run: npm run build:web

      - name: Build desktop
        working-directory: desktop
        env:
          TOPH_VERSION: ${{ steps.version.outputs.version }}
        run: npm run tauri -- build --bundles "${{ matrix.bundles }}" --config '{"version":"${{ steps.version.outputs.version }}"}'

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: toph-client-desktop-${{ matrix.platform }}
          path: desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
