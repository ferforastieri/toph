name: Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version (without v)"
        required: false
        default: "0.1.0"
  workflow_call:
    inputs:
      version:
        description: "Installer version (without v)"
        required: false
        type: string
        default: ""
      ref:
        description: "Git commit to build"
        required: false
        type: string
        default: ""
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            bundles: appimage,deb,rpm
          - platform: windows-latest
            bundles: msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/toph -> target
            apps/client/src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          apt_options=(-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=5)
          for attempt in 1 2 3; do
            if sudo timeout 900 apt-get "${apt_options[@]}" update; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            sleep 10
          done
          for attempt in 1 2 3; do
            if sudo DEBIAN_FRONTEND=noninteractive timeout 1200 apt-get "${apt_options[@]}" install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            sleep 10
          done

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Resolve desktop version
        id: version
        shell: bash
        working-directory: apps/client
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION#v}"
          if [ -z "$version" ]; then
            case "$GITHUB_REF_NAME" in
              desktop-v*) version="${GITHUB_REF_NAME#desktop-v}" ;;
              *) version="0.1.0" ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build web UI
        run: npm run build:web

      - name: Build desktop
        working-directory: apps/client
        env:
          TOPH_VERSION: ${{ steps.version.outputs.version }}
        run: npm run sync-brand && npm run tauri -- build --bundles "${{ matrix.bundles }}" --config '{"version":"${{ steps.version.outputs.version }}"}'

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: toph-client-desktop-${{ matrix.platform }}
          path: apps/client/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
