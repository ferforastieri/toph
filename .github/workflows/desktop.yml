name: Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version (without v)"
        required: false
        default: "0.1.0"
  workflow_call:
    inputs:
      version:
        description: "Installer version (without v)"
        required: false
        type: string
        default: ""
      ref:
        description: "Git commit to build"
        required: false
        type: string
        default: ""
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            goos: linux
            sidecar: toph
            bundles: appimage,deb,rpm
          - platform: windows-latest
            goos: windows
            sidecar: toph.exe
            bundles: msi
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: services/toph/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Resolve desktop version
        id: version
        shell: bash
        working-directory: apps/client
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION#v}"
          if [ -z "$version" ]; then
            case "$GITHUB_REF_NAME" in
              desktop-v*) version="${GITHUB_REF_NAME#desktop-v}" ;;
              *) version="0.1.0" ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build local Toph backend
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          npm run build:web
          rm -rf services/toph/internal/webui/dist
          mkdir -p services/toph/internal/webui/dist
          cp -R apps/web/dist/. services/toph/internal/webui/dist/
          touch services/toph/internal/webui/dist/.keep
          mkdir -p bin
          cd services/toph
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w -X github.com/ferforastieri/toph/internal/server.Version=${VERSION}" \
            -o ../../bin/${{ matrix.sidecar }} ./cmd/toph

      - name: Build desktop
        working-directory: apps/client
        run: npm run sync-brand && npm run tauri -- build --bundles "${{ matrix.bundles }}" --config '{"version":"${{ steps.version.outputs.version }}"}'

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: toph-client-desktop-${{ matrix.platform }}
          path: apps/client/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
