name: Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version (without v)"
        required: false
        default: "0.1.0"
  workflow_call:
    inputs:
      version:
        description: "Installer version (without v)"
        required: false
        type: string
        default: ""
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            goos: linux
            sidecar: toph
          - platform: windows-latest
            goos: windows
            sidecar: toph.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: Build local Toph backend
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix web
          npm run build:app --prefix web
          rm -rf backend/internal/webui/dist
          mkdir -p backend/internal/webui/dist
          cp -R web/dist/app/. backend/internal/webui/dist/
          touch backend/internal/webui/dist/.keep
          mkdir -p bin
          cd backend
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o ../bin/${{ matrix.sidecar }} ./cmd/toph

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Resolve desktop version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION#v}"
          if [ -z "$version" ]; then
            case "$GITHUB_REF_NAME" in
              desktop-v*) version="${GITHUB_REF_NAME#desktop-v}" ;;
              *) version="0.1.0" ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build desktop
        working-directory: desktop
        run: npm run sync-brand && npx tauri build --config '{"version":"${{ steps.version.outputs.version }}"}'

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: toph-desktop-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
