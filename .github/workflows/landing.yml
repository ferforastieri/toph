name: Landing

on:
  push:
    branches: [main]
    paths:
      - "landing/site/**"
      - ".github/workflows/landing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy toph-site to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: landing/site
          wranglerVersion: "4.159.0"
          command: deploy
