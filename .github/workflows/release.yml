name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Embed web and build binary
        run: |
          rm -rf internal/webui/dist
          mkdir -p internal/webui/dist
          cp -R web/dist/. internal/webui/dist/
          touch internal/webui/dist/.keep
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o toph-linux-amd64 ./cmd/toph

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        working-directory: android
        run: |
          export TOPH_VERSION_NAME="${GITHUB_REF_NAME#v}"
          export TOPH_VERSION_CODE="${GITHUB_RUN_NUMBER}"
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "../toph-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            toph-linux-amd64
            toph-${{ github.ref_name }}.apk
