name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build:app

      - name: Embed web and build binary
        run: |
          rm -rf backend/internal/webui/dist
          mkdir -p backend/internal/webui/dist
          cp -R web/dist/app/. backend/internal/webui/dist/
          touch backend/internal/webui/dist/.keep
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../toph-linux-amd64 ./cmd/toph
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../toph-linux-arm64 ./cmd/toph

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK/NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Build Tauri Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TOPH_VERSION_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is required. Debug APKs are not published."
            exit 1
          fi
          export TOPH_VERSION_NAME="${TOPH_VERSION_NAME#v}"
          export TOPH_VERSION_CODE="$((10000 + GITHUB_RUN_NUMBER))"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/toph-release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          export NDK_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          (cd desktop
           npm ci
           npm run sync-brand
           npx tauri android init
           node scripts/configure-android-signing.mjs
           npx tauri android build --apk --target aarch64 --config "{\"version\":\"${GITHUB_REF_NAME#v}\"}"
           APK=$(find src-tauri/gen/android/app/build/outputs/apk -name 'app-universal-release.apk' -print -quit)
           cp "$APK" "../toph-${GITHUB_REF_NAME}.apk"
           "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner" verify "../toph-${GITHUB_REF_NAME}.apk"
          )

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            install.sh
            toph-linux-amd64
            toph-linux-arm64
            toph-${{ github.ref_name }}.apk
