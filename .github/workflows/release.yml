name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      bump: ${{ steps.version.outputs.bump }}
      server: ${{ steps.changes.outputs.server }}
      web: ${{ steps.changes.outputs.web }}
      android: ${{ steps.changes.outputs.android }}
      desktop: ${{ steps.changes.outputs.desktop }}
      installer: ${{ steps.changes.outputs.installer }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Detect changed components
        id: changes
        env:
          HEAD_REF: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          BASE_REF="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
          if [ -n "$BASE_REF" ]; then
            files="$(git diff --name-only "$BASE_REF..$HEAD_REF" || git ls-files)"
          else
            files="$(git ls-files)"
          fi
          has_prefix() {
            local line prefix
            while IFS= read -r line; do
              for prefix in "$@"; do
                case "$line" in "$prefix"*) return 0 ;; esac
              done
            done <<< "$files"
            return 1
          }
          has_file() {
            local line name
            while IFS= read -r line; do
              for name in "$@"; do
                [ "$line" = "$name" ] && return 0
              done
            done <<< "$files"
            return 1
          }
          web=false
          if has_prefix web/ packages/ || has_file package.json package-lock.json tsconfig.json vite.config.ts; then web=true; fi
          backend=false
          if has_prefix backend/ web/ packages/ || has_file package.json package-lock.json; then backend=true; fi
          server=$backend
          client=false
          if has_prefix desktop/ packages/ || has_file package.json package-lock.json; then client=true; fi
          shared=false
          if has_prefix packages/native/ packages/launcher/; then shared=true; fi
          android=false
          if has_prefix mobile/ packages/brand/ || [ "$shared" = true ] || has_file package.json package-lock.json .github/workflows/ci.yml .github/workflows/release.yml; then android=true; fi
          desktop=false
          if [ "$client" = true ] || [ "$backend" = true ] || [ "$web" = true ] || [ "$shared" = true ] || has_prefix .github/workflows/desktop.yml; then desktop=true; fi
          landing=false
          if has_prefix landing/; then landing=true; fi
          installer=false
          if has_file install.sh; then installer=true; fi
          releasable=false
          if [ "$server" = true ] || [ "$android" = true ] || [ "$desktop" = true ] || [ "$installer" = true ]; then releasable=true; fi
          count="$(printf '%s\n' "$files" | grep -c . || true)"
          {
            echo "web=$web"
            echo "server=$server"
            echo "android=$android"
            echo "desktop=$desktop"
            echo "landing=$landing"
            echo "installer=$installer"
            echo "releasable=$releasable"
            echo "files=$count"
          } >> "$GITHUB_OUTPUT"

      - name: Determine next version
        id: version
        env:
          RELEASABLE: ${{ steps.changes.outputs.releasable }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          at_head="$(git tag --points-at HEAD --list 'v*' | paste -sd ', ' -)"
          emit() { printf '%s\n' "$@" >> "$GITHUB_OUTPUT"; }
          if [ "${RELEASABLE:-false}" = "false" ]; then
            emit "release=false" "reason=no releasable component changed"
            exit 0
          fi
          if [ -n "$at_head" ]; then
            emit "release=false" "reason=HEAD is already tagged $at_head"
            exit 0
          fi
          range="HEAD"
          [ -n "$latest" ] && range="$latest..HEAD"
          mapfile -d '' raw < <(git log "$range" --format='%B%x00' || true)
          messages=()
          for message in "${raw[@]}"; do
            message="${message#"${message%%[![:space:]]*}"}"
            message="${message%"${message##*[![:space:]]}"}"
            [ -n "$message" ] && messages+=("$message")
          done
          if [ "${#messages[@]}" -eq 0 ]; then
            emit "release=false" "reason=no commits since ${latest:-the start}"
            exit 0
          fi
          bump=patch
          for message in "${messages[@]}"; do
            subject="${message%%$'\n'*}"
            if [[ "$subject" =~ ^[A-Za-z]+(\([^\)]*\))?!: ]] || grep -qE '(^|\n)BREAKING[ -]CHANGE:' <<< "$message"; then
              bump=major
              continue
            fi
            if [[ "$subject" =~ ^feat(\([^\)]*\))?: ]] && [ "$bump" != "major" ]; then
              bump=minor
            fi
          done
          if [[ "$latest" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          else
            major=0
            minor=0
            patch=0
          fi
          case "$bump" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="${major}.$((minor + 1)).0" ;;
            *) version="${major}.${minor}.$((patch + 1))" ;;
          esac
          emit "release=true" "version=$version" "tag=v$version" "bump=$bump" "base=${latest:-none}" "commits=${#messages[@]}"

  server:
    needs: prepare
    if: needs.prepare.outputs.release == 'true' && needs.prepare.outputs.server == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: amd64
            output: toph-linux-amd64
          - runner: ubuntu-24.04-arm
            artifact: arm64
            output: toph-linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - run: npm ci
      # The server embeds web/dist, so this is required even when only
      # backend code changed.
      - run: npm run build:web

      - name: Build server binary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TOPH_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cargo build --release --manifest-path backend/Cargo.toml --bin toph
          cp backend/target/release/toph "${{ matrix.output }}"

      - name: Upload server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.artifact }}
          path: |
            install.sh
            ${{ matrix.output }}
          if-no-files-found: error

  android:
    needs: prepare
    if: needs.prepare.outputs.release == 'true' && needs.prepare.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK/NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - run: npm ci

      - name: Add Firebase client config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > mobile/src-tauri/gen/android/app/google-services.json

      - name: Build Tauri Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TOPH_VERSION_NAME: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is required. Debug APKs are not published."
            exit 1
          fi
          export TOPH_VERSION_CODE="$((10000 + GITHUB_RUN_NUMBER))"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/toph-release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          export NDK_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          cd mobile
          npm run icons
          npm run tauri -- android build --apk --target aarch64 --config "{\"version\":\"${TOPH_VERSION_NAME}\"}"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name 'app-universal-release.apk' -print -quit)
          cp "$APK" "../toph-v${TOPH_VERSION_NAME}.apk"
          "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner" verify "../toph-v${TOPH_VERSION_NAME}.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: toph-v${{ needs.prepare.outputs.version }}.apk
          if-no-files-found: error

  desktop:
    needs: prepare
    if: needs.prepare.outputs.release == 'true' && needs.prepare.outputs.desktop == 'true'
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ github.event.workflow_run.head_sha }}

  publish:
    needs: [prepare, server, android, desktop]
    if: |
      always() &&
      needs.prepare.outputs.release == 'true' &&
      (needs.server.result == 'success' || needs.server.result == 'skipped') &&
      (needs.android.result == 'success' || needs.android.result == 'skipped') &&
      (needs.desktop.result == 'success' || needs.desktop.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/download-artifact@v4
        if: needs.server.result == 'success' || needs.android.result == 'success' || needs.desktop.result == 'success'
        with:
          path: artifacts

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp install.sh release/
          if [ -d artifacts/server-amd64 ]; then
            cp artifacts/server-amd64/toph-linux-amd64 release/
          fi
          if [ -d artifacts/server-arm64 ]; then
            cp artifacts/server-arm64/toph-linux-arm64 release/
          fi
          if [ -d artifacts/android ]; then
            find artifacts/android -name '*.apk' -exec cp {} release/ \;
          fi
          if [ -d artifacts/toph-client-desktop-ubuntu-24.04 ]; then
            find artifacts/toph-client-desktop-ubuntu-24.04 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} release/ \;
          fi
          if [ -d artifacts/toph-client-desktop-windows-latest ]; then
            find artifacts/toph-client-desktop-windows-latest -type f -name '*.msi' -exec cp {} release/ \;
          fi
          ls -lh release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: Toph ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: release/*
