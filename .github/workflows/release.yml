name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      bump: ${{ steps.version.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Fetch tags and determine next version
        id: version
        run: |
          set -euo pipefail
          git fetch --tags --force
          node scripts/next-version.mjs

  server:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run build:web

      - name: Embed web and build server binaries
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf services/toph/internal/webui/dist
          mkdir -p services/toph/internal/webui/dist
          cp -R apps/web/dist/. services/toph/internal/webui/dist/
          touch services/toph/internal/webui/dist/.keep
          cd services/toph
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w -X github.com/ferforastieri/toph/internal/server.Version=${VERSION}" \
            -o ../../toph-linux-amd64 ./cmd/toph
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w -X github.com/ferforastieri/toph/internal/server.Version=${VERSION}" \
            -o ../../toph-linux-arm64 ./cmd/toph

      - name: Upload server binaries
        uses: actions/upload-artifact@v4
        with:
          name: server
          path: |
            install.sh
            toph-linux-amd64
            toph-linux-arm64
          if-no-files-found: error

  android:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK/NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - run: npm ci

      - name: Build Tauri Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TOPH_VERSION_NAME: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is required. Debug APKs are not published."
            exit 1
          fi
          export TOPH_VERSION_CODE="$((10000 + GITHUB_RUN_NUMBER))"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/toph-release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          export NDK_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          cd apps/client
          npm run sync-brand
          npm run tauri -- android init
          npm run icons
          npm run android:patch
          node scripts/configure-android-signing.mjs
          npm run tauri -- android build --apk --target aarch64 --config "{\"version\":\"${TOPH_VERSION_NAME}\"}"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name 'app-universal-release.apk' -print -quit)
          cp "$APK" "../../toph-v${TOPH_VERSION_NAME}.apk"
          "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner" verify "../../toph-v${TOPH_VERSION_NAME}.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: toph-v${{ needs.prepare.outputs.version }}.apk
          if-no-files-found: error

  desktop:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ github.event.workflow_run.head_sha }}

  publish:
    needs: [prepare, server, android, desktop]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/server/install.sh release/
          cp artifacts/server/toph-linux-amd64 release/
          cp artifacts/server/toph-linux-arm64 release/
          find artifacts/android -name '*.apk' -exec cp {} release/ \;
          find artifacts/toph-client-desktop-ubuntu-24.04 -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} release/ \;
          find artifacts/toph-client-desktop-windows-latest -type f \( -name '*.msi' \) -exec cp {} release/ \;
          ls -lh release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: Toph ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: release/*
